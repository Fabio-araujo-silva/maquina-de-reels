<template>
<style>
  #root { position: absolute; inset: 0; overflow: hidden; }
  #__MUNDO__-tela { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<div id="root" data-composition-id="__MUNDO__" data-width="1080" data-height="1920">
  <canvas id="__MUNDO__-tela" width="1080" height="1920"></canvas>
</div>
<script type="module">
// Estilo principal "colagem halftone" (gbro em código): cada fala é uma colagem montada do zero.
// As colagens vêm de storyboard.json → colagens (uma por fala). Falas sem colagem herdam a anterior.
// O loop: a última fala usa a MESMA colagem da primeira (o motor já cuida disso em REEL.colagens_mundo).
import { criarColagem } from 'kit/colagem.js';
import { ligarMundo } from 'kit/nucleo.js';

const R = window.REEL;
const tela = document.getElementById('__MUNDO__-tela');
const g = tela.getContext('2d');
const specs = R.colagens_mundo || [];
// cada colagem desenha no próprio canvas; copiamos a ativa para a tela
const colagens = specs.map((s, i) => {
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1920;
  return { ...s, cv, motor: criarColagem(cv, s, { semente: 11 + i }) };
});

function render(t) {
  let atual = colagens[0];
  for (const c of colagens) if (t >= c.inicio) atual = c;
  if (!atual) { g.fillStyle = '#e8a33d'; g.fillRect(0, 0, 1080, 1920); return; }
  atual.motor.desenhar(t);
  g.drawImage(atual.cv, 0, 0);
}
// Não mude esta linha: num vídeo híbrido ela mostra este mundo só nas janelas dele (REEL.mundos) e pula o resto.
ligarMundo('__MUNDO__', tela, render);
window.__timelines['__MUNDO__'] = gsap.timeline({ paused: true });
</script>
</template>
